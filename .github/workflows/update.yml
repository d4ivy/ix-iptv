# Lista diaria de canales de iptv-org con los streams validados.
#
# - Corre cada día después de la actualización de iptv-org (sus listas salen a las ~00:14 UTC) y también a mano (Run workflow).
# - Usa Node 16.20.2: la validación TLS usa el almacén de CA de Node 16 (el de los clientes que corren en ese runtime).
# - Solo publica si la salida pasa `scripts/verify.mjs` (forma y un mínimo de canales): si algo falla, Pages sigue sirviendo la
#   última lista buena.
# - `keepalive`: GitHub desactiva los workflows programados de un repo público tras 60 días sin actividad; volver a habilitarlo
#   en cada ejecución por la API lo evita sin commits.
name: Actualizar canales

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      - name: Pruebas del validador
        run: npm test

      - name: Validar todos los canales
        run: node src/cli.mjs --out site --concurrency 48 --per-host 2 --min-channels 3000

      - name: Comprobar la salida
        run: node scripts/verify.mjs --dir site --min-channels 3000

      - name: Resumen
        if: always()
        run: |
          if [ -f site/report.json ]; then
            {
              echo '### Lista de canales'
              echo '```json'
              node -e "const r=require('./site/report.json');console.log(JSON.stringify({durationSeconds:r.durationSeconds,output:r.output,validation:{ok:r.validation.ok,failed:r.validation.failed,reasons:r.validation.reasons}},null,2))"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Mantener activo el cron
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
